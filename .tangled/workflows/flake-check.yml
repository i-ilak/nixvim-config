when:
  - event: ["push", "manual"]
    branch: ["stable"]
  - event: ["pull_request"]
    branch: ["stable"]

engine: "nixery"

dependencies:
  nixpkgs:
    - nix

environment:
  NIX_CONFIG: "experimental-features = nix-command flakes"

steps:
  - name: "nix flake check"
    command: "nix flake check --all-systems"
